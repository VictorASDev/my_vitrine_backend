spring:
  datasource:
    url: jdbc:h2:mem:myvitrine;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    database-platform: com.myvitrine.api.config.TestH2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration

myvitrine:
  security:
    jwt:
      issuer: myvitrine-api-test
      access-token-ttl: 15m
      refresh-token-ttl: 7d
      cookie-secure: false
