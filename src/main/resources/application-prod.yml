springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

cors:
  originPatterns: ${CORS_ORIGINS}

spring:
  application:
    name: myvitrine-api-PROD
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

myvitrine:
  security:
    jwt:
      private-key: ${JWT_PRIVATE_KEY}
      public-key: ${JWT_PUBLIC_KEY}
      cookie-secure: true