spring:
  application:
    name: myvitrine-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/myvitrine}
    username: ${DB_USERNAME:postegres}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
