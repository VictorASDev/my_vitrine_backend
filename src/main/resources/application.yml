cors:
  originPatterns: ${CORS_ORIGINS:http://localhost:5173}

spring:
  application:
    name: myvitrine-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/myvitrine}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

    flyway:
      enabled: true
      locations: classpath:db/migration
      baseline-on-migrate: true

  springdoc:
    swagger-ui:
      path: /swagger-ui.html
    api-docs:
      path: /v3/api-docs

  myvitrine:
    security:
      jwt:
        issuer: myvitrine-api
        access-token-ttl: 15m
        refresh-token-ttl: 7d
        # PEM (com ou sem os cabecalhos -----BEGIN/END-----), em base64 de uma linha so.
        # Se vazio, um par RSA-2048 efemero e gerado em memoria (apenas para dev — ver JwtKeyConfig).
        private-key: ${JWT_PRIVATE_KEY:}
        public-key: ${JWT_PUBLIC_KEY:}
        # Atributo Secure do cookie de refresh token. Mantenha true em producao (HTTPS);
        # so desative localmente se estiver testando sobre http puro.
        cookie-secure: ${JWT_COOKIE_SECURE:true}
