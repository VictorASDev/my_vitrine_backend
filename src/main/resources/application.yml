spring:
  application:
    name: myvitrine-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/myvitrine}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

springdoc:
  enabled: true
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

cors:
  originPatterns: ${CORS_ORIGINS:http://localhost:5173}

myvitrine:
  security:
    jwt:
      issuer: myvitrine-api
      access-token-ttl: 15m
      refresh-token-ttl: 7d
      private-key: ${JWT_PRIVATE_KEY:}
      public-key: ${JWT_PUBLIC_KEY:}
      cookie-secure: ${JWT_COOKIE_SECURE:false}